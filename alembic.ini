# Alembic settings. Normally you do not run alembic directly:
#   python -m smartmet_db migrate          bring the database up to date
# To create a new migration after changing smartmet_db/models.py:
#   alembic revision --autogenerate -m "what changed"
# The database URL comes from .env (DATABASE_URL), see smartmet_db/migrations/env.py.

[alembic]
script_location = %(here)s/smartmet_db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
