<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartMet4QC Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="inner">
      <h1>SmartMet4QC</h1>
      <span class="sub">Fermentation quality control</span>
      <span class="spacer"></span>
      <span class="sub" id="updated"></span>
    </div>
  </header>

  <main>
    <section>
      <h2>Open alerts</h2>
      <ul class="alerts" id="alerts"></ul>
    </section>

    <section>
      <h2>Batches</h2>
      <div class="cards" id="batches"></div>
    </section>

    <section>
      <h2>Devices</h2>
      <div id="devices"></div>
      <p class="small muted">Add a device (and get its key) in a terminal:
        <code>python -m smartmet_db device add tank-1</code>. Choose a device's batch on the batch page.</p>
    </section>

    <section>
      <h2>Start a new batch</h2>
      <form class="inline" id="new-batch">
        <label>Batch code
          <input name="code" required maxlength="50" pattern="[A-Za-z0-9_\-]+" placeholder="BATCH-010">
        </label>
        <label>Notes (optional)
          <input name="notes" maxlength="200" size="30" placeholder="e.g. 40 L, new banana supplier">
        </label>
        <button class="primary" type="submit">Start batch</button>
      </form>
      <div class="message" id="new-batch-msg"></div>
    </section>
  </main>

  <script src="/static/common.js"></script>
  <script>
    async function load() {
      const [batches, alerts, devices] = await Promise.all(
        [api("/api/v1/batches"), api("/api/v1/alerts?status=open"), api("/api/v1/devices")]);
      if (!batches.ok || !alerts.ok || !devices.ok) {
        document.getElementById("updated").textContent = "Cannot reach the server";
        return;
      }
      renderAlerts(alerts.body);
      renderBatches(batches.body, alerts.body);
      document.getElementById("devices").innerHTML = devices.body.length
        ? `<ul class="alerts">${devices.body.map((d) => deviceItem(d, { showBatch: true })).join("")}</ul>`
        : `<p class="empty">No devices yet.</p>`;
      stamp(document.getElementById("updated"));
    }

    function renderAlerts(alerts) {
      // "Finished" is good news, not a problem: it is shown on the batch card instead.
      const problems = sortAlerts(alerts.filter((a) => a.severity !== "info"));
      document.getElementById("alerts").innerHTML = problems.length
        ? problems.map((a) => alertItem(a, { showBatch: true })).join("")
        : `<li class="empty">No open problems.</li>`;
    }

    function renderBatches(batches, alerts) {
      const el = document.getElementById("batches");
      if (!batches.length) {
        el.innerHTML = `<p class="empty">No batches yet. Start one below, or send readings from the simulator.</p>`;
        return;
      }
      // Active batches first, then the most recent.
      batches.sort((a, b) => (a.status !== "active") - (b.status !== "active")
        || String(b.last || "").localeCompare(String(a.last || "")));
      el.innerHTML = batches.map((b) => {
        const mine = alerts.filter((a) => a.batch_id === b.code);
        const count = (sev) => mine.filter((a) => a.severity === sev).length;
        const badges = [
          count("critical") && `<span class="pill critical">${count("critical")} critical</span>`,
          count("warning") && `<span class="pill warning">${count("warning")} warning</span>`,
          mine.some((a) => a.rule === "batch_finished") && `<span class="pill info">looks finished</span>`,
        ].filter(Boolean).join("");
        return `<a class="card ${count("critical") ? "has-critical" : ""}" href="/batches/${encodeURIComponent(b.code)}">
          <div class="top"><span class="code">${esc(b.code)}</span><span class="pill ${esc(b.status)}">${esc(b.status)}</span></div>
          <div class="small muted">${b.readings} readings · last ${fmtTime(b.last)}</div>
          <div class="badges">${badges || `<span class="small muted">No open alerts</span>`}</div>
        </a>`;
      }).join("");
    }

    document.getElementById("new-batch").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      const msg = document.getElementById("new-batch-msg");
      const result = await api("/api/v1/batches", {
        method: "POST",
        body: JSON.stringify({ code: form.get("code").trim(), notes: form.get("notes").trim() || null }),
      });
      if (result.ok) {
        location.href = "/batches/" + encodeURIComponent(result.body.code);
      } else {
        msg.className = "message error";
        msg.textContent = errorText(result.body);
      }
    });

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
